server:
  port: 8080

spring:
  application:
    name: medisphere-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medisphere}
    username: ${DB_USERNAME:medisphere}
    password: ${DB_PASSWORD:medisphere}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

medisphere:
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-please-override-in-env-min-256-bits}
    access-token-minutes: ${JWT_ACCESS_MINUTES:60}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  seed:
    enabled: ${SEED_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    root: INFO
    com.medisphere: INFO
