services:
  postgres:
    image: postgres:16-alpine
    container_name: medisphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-medisphere}
      POSTGRES_USER: ${DB_USERNAME:-medisphere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medisphere}
    ports:
      - "5432:5432"
    volumes:
      - medisphere-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-medisphere}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medisphere-postgres-data:
